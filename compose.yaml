services:
  llm-proxy:
    build: .
    image: llm-proxy:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - llm-proxy-data:/data
    environment:
      LLMPROXY_CAPTURE_MAX_BYTES: "33554432"
      LLMPROXY_RETENTION_DAYS: "7"
      LLMPROXY_MAX_REQUESTS_PER_PROJECT: "10000"
      LLMPROXY_UPSTREAM_HEADER_TIMEOUT: "5m"

volumes:
  llm-proxy-data:

