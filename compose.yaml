services:
  llm-proxy:
    build: .
    image: llm-proxy:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    user: "${USER_UID:-1000}:${USER_GID:-1000}"
    volumes:
      - ./data:/data
      #- llm-proxy-data:/data
    environment:
      LLMPROXY_LISTEN: "0.0.0.0:8080"
      LLMPROXY_DATA_DIR: "/data"
      LLMPROXY_USERNAME: "${LLMPROXY_USERNAME:-admin}"
      LLMPROXY_PASSWORD: "${LLMPROXY_PASSWORD:-admin}"
      NOAUTH: "${NOAUTH:-false}"
      LLMPROXY_CAPTURE_MAX_BYTES: "${LLMPROXY_CAPTURE_MAX_BYTES:-33554432}"
      # 已完成请求的保留天数；0 表示不按天数自动清理。
      LLMPROXY_RETENTION_DAYS: "${LLMPROXY_RETENTION_DAYS:-0}"
      # 每个项目最多保留的请求数；0 表示不按数量淘汰旧请求。
      LLMPROXY_MAX_REQUESTS_PER_PROJECT: "${LLMPROXY_MAX_REQUESTS_PER_PROJECT:-0}"
      LLMPROXY_UPSTREAM_HEADER_TIMEOUT: "${LLMPROXY_UPSTREAM_HEADER_TIMEOUT:-5m}"

